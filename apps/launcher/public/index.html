<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nucleus</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/icon.svg" alt="" width="34" height="34" />
        <div class="brand-text">
          <strong>Nucleus</strong>
          <span class="sub" id="count">loading…</span>
        </div>
      </div>

      <div class="spacer"></div>

      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" class="search" type="search" placeholder="Search apps" autocomplete="off" />
      </label>

      <div class="segmented" role="tablist" aria-label="View">
        <button type="button" data-view="grid" class="active" title="Grid view">Grid</button>
        <button type="button" data-view="table" title="Table view">Table</button>
      </div>

      <button type="button" id="theme" class="icon-btn" title="Toggle theme">☾</button>
    </header>

    <main id="main">
      <section id="grid" class="groups"></section>

      <section id="table-wrap" class="table-wrap" hidden>
        <table class="table">
          <thead>
            <tr>
              <th>App</th>
              <th>Inspired by</th>
              <th>Category</th>
              <th>Status</th>
              <th>Version</th>
              <th class="right">Action</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </section>

      <div id="empty" class="empty" hidden>
        <span class="empty-mark">◎</span>
        <p>No apps match your search.</p>
      </div>
    </main>

    <footer class="status">
      <span id="status">Ready</span>
      <span id="running-count"></span>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
